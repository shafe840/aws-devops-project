<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AWS DevOps Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <h1>🚀 AWS DevOps Dashboard</h1>

        <p class="subtitle">
            My Cloud & DevOps Deployment Project
        </p>

        <div class="cards">

            <div class="card">
                <div>🟢</div>
                <h2>Application</h2>
                <p class="status">Running</p>
            </div>

            <div class="card">
                <div>☁️</div>
                <h2>AWS</h2>
                <p>Cloud Deployment</p>
            </div>

            <div class="card">
                <div>🐳</div>
                <h2>Docker</h2>
                <p>Containerization</p>
            </div>

            <div class="card">
                <div>🔄</div>
                <h2>CI/CD</h2>
                <p>Automated Deployment</p>
            </div>

        </div>

    </div>

</body>
</html>
