name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: aws-devops-project:ci
      - name: Show GitHub repository IDs
        run: |
          echo "OWNER_ID=${{ github.repository_owner_id }}"
          echo "REPOSITORY_ID=${{ github.repository_id }}"