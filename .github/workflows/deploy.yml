name: AWS DevOps CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: aws-devops-project
  EC2_INSTANCE_ID: i-09c3bf3df26f8b9ca

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::683604925197:role/GitHubActionsECRRole
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:latest .

      - name: Tag Docker image
        run: |
          docker tag $ECR_REPOSITORY:latest \
          683604925197.dkr.ecr.eu-north-1.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Push Docker image
        run: |
          docker push \
          683604925197.dkr.ecr.eu-north-1.amazonaws.com/$ECR_REPOSITORY:latest
      - name: Deploy to EC2
        run: |
          aws ssm send-command \
            --region us-east-1 \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 683604925197.dkr.ecr.eu-north-1.amazonaws.com",
              "docker pull 683604925197.dkr.ecr.eu-north-1.amazonaws.com/aws-devops-project:latest",
              "docker stop aws-devops-container || true",
              "docker rm aws-devops-container || true",
              "docker run -d --name aws-devops-container -p 80:3000 683604925197.dkr.ecr.eu-north-1.amazonaws.com/aws-devops-project:latest"
            ]'